version: 2

models:
  - name: stg_mdds_jad_corpbondinfor
    description: "Staging model của bảng MDDS.JAD_CORPBONDINFOR"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["tradingdate"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("stg_mdds_schema") }}'
      alias: 'jad_corpbondinfor'
      tags:
        - layer_staging
        - domain_mdds

