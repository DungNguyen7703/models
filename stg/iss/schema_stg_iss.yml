version: 2

models:
  - name: stg_iss_input_report_template
    description: "Staging model của bảng Input Report Template (mẫu báo cáo - master data)"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      partition_by: ["ds_snpst_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("stg_iss_schema") }}'
      alias: 'input_report_template'
      tags:
        - layer_staging
        - domain_iss

  - name: stg_iss_input_report_template_sheet
    description: "Staging model của bảng Input Report Template Sheet (cấu trúc sheet của mẫu báo cáo - master data)"
