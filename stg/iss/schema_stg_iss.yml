  - name: stg_iss_flat_metric_tree
    description: "Flatten cay chi tieu INPUT_REPORT_METRIC (JOIN INPUT_REPORT_TEMPLATE_SHEET + INPUT_REPORT_TEMPLATE, mo phong CONNECT BY cua Oracle bang self-join level-by-level) - khong co bang nguon that, doc thang tu 3 raw source va tu tinh lai cay"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      partition_by: ["ds_snpst_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("stg_iss_schema") }}'
