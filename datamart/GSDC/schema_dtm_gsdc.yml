  - name: dtm_public_company_financial_yoy_rpt
    description: "Datamart model của báo cáo Public Company Financial YoY Report — cross-tab theo equity_listing_exchange_code × business_line_level_1_code/rpt_year/rpt_quarter (mỗi chiều đều có nhóm rollup 'ALL', kể cả grand-total (san='ALL', nganh='ALL') thêm lại 2026-09-22), phục vụ dashboard: chọn sàn → xem breakdown theo ngành. Đổi tên 2026-09-19 từ dtm_public_company_exchange_financial_yoy_rpt về lại tên gốc sau khi gộp thêm chiều ngành vào cùng bảng thay vì tách bảng riêng (dtm_public_company_industry_financial_yoy_rpt đã bị xóa)."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["rpt_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'public_company_financial_yoy_rpt'
      tags:
        - layer_datamart
        - domain_gsdc

  - name: dtm_public_company_financial_ytd_chg_rpt
    description: "Datamart model trung gian tính % thay đổi từ đầu năm (BCĐKT cột 'Số đầu năm') cho 9 chỉ tiêu cân đối: total_asset, inventory, total_liability, equity, contributed_capital, undistributed_profit, receivable, cash_and_equivalent và debt_to_equity (đều là tốc độ thay đổi %). Grain/universe giống dtm_public_company_financial_yoy_rpt (sàn × ngành, rollup 'ALL', 4 sàn). Chỉ phục vụ JOIN cho dtm_public_company_exchange_financial_summary_rpt và dtm_public_company_exchange_industry_financial_rpt, không có ClickHouse flat."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["rpt_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'public_company_financial_ytd_chg_rpt'
      tags:
        - layer_datamart
        - domain_gsdc

