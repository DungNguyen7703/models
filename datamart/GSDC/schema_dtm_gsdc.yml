  - name: dtm_public_company_exchange_industry_financial_rpt
    description: "Datamart model của báo cáo Public Company Exchange × Industry Financial Report — cross-tab theo equity_listing_exchange_code × business_line_level_1_code/rpt_year/rpt_quarter, gồm 2 nhóm: (sàn cụ thể, ngành cụ thể) và (sàn='ALL', ngành cụ thể). Cùng bộ chỉ số với dtm_public_company_exchange_financial_summary_rpt, YoY đọc từ dtm_public_company_financial_yoy_rpt."
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["rpt_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'public_company_exchange_industry_financial_rpt'
      tags:
