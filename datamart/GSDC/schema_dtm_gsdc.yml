version: 2

models:
  - name: dtm_fct_public_company_compliance_evaluation_snpst
    description: "Datamart model của bảng Fact Public Company Compliance Evaluation Snapshot — điểm (score) + mức độ/kết quả đánh giá (assessment) từng tiêu chí nhóm Tuân thủ"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_public_company_compliance_evaluation_snpst'
      tags:
        - layer_datamart
        - domain_gsdc

