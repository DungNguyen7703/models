version: 2

models:
  - name: dtm_fct_practitioner_daily_snpst
    description: "Datamart model của bảng Fact Practitioner Daily Snapshot"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_practitioner_daily_snpst'
      tags:
        - layer_datamart
        - domain_nhnck

  - name: dtm_fct_practitioner_license_certificate_snpst
    description: "Datamart model của bảng Fact Practitioner License Certificate Snapshot"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_practitioner_license_certificate_snpst'
      tags:
        - layer_datamart
        - domain_nhnck

