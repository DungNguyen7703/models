version: 2

models:
  - name: dtm_examination_team_dim
    description: "Datamart model của bảng Examination Team Dimension"
    config:
      materialized: scd4a
      unique_key: ["examination_team_dim_id"]
      source_system: ["THANHTRA_EXAMINATION_TEAM"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'examination_team_dim'
      tags:
        - layer_datamart

