version: 2

models:
  - name: dtm_fct_securities_foreign_trading_snpst
    description: "Datamart model của bảng Fact Securities Foreign Trading Snapshot"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_securities_foreign_trading_snpst'
      tags:
        - layer_datamart
        - domain_ndtnn

