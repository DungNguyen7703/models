  - name: dtm_fct_securities_company_financial_structure_snpst
    description: "[MOI 2026-09-19, cap nhat 2026-10-23] Datamart model của bảng Fact Securities Company Financial Structure Snapshot - da sua khoa join dung theo chain sc_report_input_value -> sc_report_input_submission -> sc_periodic_report (ref_tp_code='BAO_CAO_DINH_KY') -> securities_company, rpt_code lay qua JOIN atm_sc_report. Bo sung dieu kien ds_rcrd_st = 'ACTIVE' cho sc_report/sc_periodic_report/sc_report_input_submission theo dung LLD - PHU THUOC cot ds_rcrd_st se duoc bo sung o tang atomic (model chua compile duoc cho toi khi do). Bo sung cot PK rpt_input_val_id con thieu (mapping dong 2), sua indicator_val_amt sang decimal(25,2), doi incremental_strategy sang merge voi unique_key = rpt_input_val_id theo dung DDL chuan"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_securities_company_financial_structure_snpst'
      tags:
        - layer_datamart
        - domain_qlkd

  - name: dtm_opr_securities_company_report_data
    description: "[MOI 2026-09-19, cap nhat 2026-10-23] Datamart model của bảng Securities Company Report Data - da sua khoa join dung theo chain sc_report_input_value -> sc_report_input_submission -> sc_periodic_report (ref_tp_code='BAO_CAO_DINH_KY') -> securities_company (giong dtm_opr_securities_company_financial_report_hist), rpt_code lay qua JOIN atm_sc_report, sua ten cot row_no/item_val thanh row_index/cell_val cho dung atomic"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      partition_by: ["ds_snpst_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'opr_securities_company_report_data'
      tags:
        - layer_datamart
        - domain_qlkd

  - name: dtm_opr_securities_company_financial_report_hist
    description: "[MOI 2026-09-19, cap nhat 2026-10-19] Datamart model của bảng Securities Company Financial Report History - da sua khoa join dung theo chain sc_report_input_value -> sc_report_input_submission -> sc_periodic_report (ref_tp_code='BAO_CAO_DINH_KY') -> securities_company, rpt_code lay qua JOIN atm_sc_report. Bo sung cot preferred_report_ind. roa_rate/roe_rate con NULL do LLD chua co cong thuc cu the"
    config:
      materialized: scd4a
      unique_key: ["fin_rpt_hist_id"]
      source_system: ["SCMS_REPORT_INPUT_CELL_VALUE"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'opr_securities_company_financial_report_hist'
      tags:
        - layer_datamart
        - domain_qlkd

  - name: dtm_opr_securities_company_practitioner_profile
    description: "[MOI 2026-09-19, cap nhat 2026-10-19] Datamart model của bảng Securities Company Practitioner Profile - da sua khoa join dung (giong financial_report_hist), them filter rpt_code IN ('BCTHHD_CTCK','BCHDPS') de phan biet voi financial_report_hist, bo sung cot rpt_code/rpt_period_tp_code/submission_status_code, sua PK hash du 5 thanh phan"
    config:
      materialized: scd4a
      unique_key: ["prac_profile_id"]
      source_system: ["SCMS_REPORT_INPUT_CELL_VALUE"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'opr_securities_company_practitioner_profile'
      tags:
        - layer_datamart
        - domain_qlkd

