version: 2

models:
  - name: dtm_fct_market_index_snpst
    description: "Datamart model của bảng Fact Market Index Snapshot"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["snpst_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_market_index_snpst'
      tags:
        - layer_datamart
        - domain_qlkd

  - name: dtm_fct_securities_company_capital_raising_event
    description: "[SUA 2026-10-19] Datamart model của bảng Fact Securities Company Capital Raising Event - doi truc ngay sang document_dt (result_rpt_dt NULL 84/84 dong), dong bo cong thuc classify offering_form voi dtm_offering_form_dim"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["event_dt_dim_id"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'fct_securities_company_capital_raising_event'
      tags:
        - layer_datamart
        - domain_qlkd

