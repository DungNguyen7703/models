  - name: dtm_opr_securities_company_compliance_hist
    description: "[SUA 2026-10-19 theo LLD BA STT 40] Datamart model của bảng Operational Securities Company Compliance History - 4 nhanh UNION ALL: EXAMINATION/INSPECTION (grain 1 dot/1 CTCK, bo fan-out theo hanh vi) + PENALTY_DECISION (moi, 1 dong/doi tuong) + PENALTY_DETAIL (moi, 1 dong/doi tuong x hanh vi). Bo nhanh ADMIN_PENALTY_DECISION (khong con trong LLD)."
    config:
      materialized: scd4a
      unique_key: ["compliance_event_code"]
      source_system: ["THANHTRA_EXAMINATION_TEAM_TARGET", "THANHTRA_INSPECTION_TEAM_TARGET", "THANHTRA_PENALTY_DECISION_SUBJECT", "THANHTRA_PENALTY_DECISION_SUBJECT_BEHAVIOR"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("dtm_schema") }}'
      alias: 'opr_securities_company_compliance_hist'
      tags:
        - layer_datamart
        - domain_qlkd

