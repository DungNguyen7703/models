# ---------------------------------- DATAMART (dim, snapshot tung ngay) ----------------------------------
- name: ft_dtm_securities_dim
  description: '[FIRST-TIME] Ban khoi tao du lieu lich su (_hstr theo tung ngay) cua dtm_securities_dim - ghi vao bang that securities_dim va securities_dim_hstr.'
  config:
    materialized: ft_scd4a
    ft_target: securities_dim
    ft_hstr_by_day: true
    ft_source_system:
    - MDDS_JAD_STOCKINFOR
    unique_key:
    - securities_dim_id
    file_format: '{{ var("file_format") }}'
    schema: '{{ var("dtm_schema") }}'
    tags:
    - first_time
    - domain_first_time
    - first_time_ndtnn
