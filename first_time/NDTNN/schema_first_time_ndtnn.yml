# ==========================================================================================
# FIRST-TIME NDTNN: bo model khoi tao du lieu lich su cho tab Giao dich + Giam sat dong von (Phan he NDTNN).
# - Chi tang datamart (5 fact) va ClickHouse (5 flat). Atomic / stg / ods KHONG co ban ft_ o day.
# - Ten model = 'ft_' + ten model daily; ghi vao DUNG bang vat ly cua model daily qua config ft_target
#   (materialization ft_incremental_rebase trong macros/first_time - dung chung voi GSTT).
# - Tag first_time + domain_first_time: orchestrator chi chay khi chon dich danh (giong GSTT).
#   Tag first_time_ndtnn: chon rieng bo NDTNN (tag first_time se chay ca GSTT).
# - 2026-10-12 nghia.le: tao moi, cau hinh lay tu yml daily tuong ung
#   (datamart/NDTNN/schema_dtm_ndtnn.yml, clickhouse/NDTNN/ck_ndtnn.yml).
# ==========================================================================================
version: 2
models:
# ---------------------------------- ODS/ATOMIC (HNX Bond Order Book) ----------------------------------
- name: ft_ods_hnx_outright_order_book
  description: '[FIRST-TIME] Ban khoi tao du lieu lich su cua ods_hnx_outright_order_book - ghi vao bang that outright_order_book.'
  config:
    materialized: ft_incremental_rebase
    ft_target: outright_order_book
    incremental_strategy: append
    partition_by:
    - ds_snpst_dt
    file_format: '{{ var("file_format") }}'
    schema: '{{ var("ods_hnx_schema") }}'
    tags:
    - first_time
    - domain_first_time
    - first_time_ndtnn
