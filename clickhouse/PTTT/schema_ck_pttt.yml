# ClickHouse dbt YAML — Module PTTT

version: 2

models:
  - name: pttt_fct_market_risk_snpst_flat
    description: "Flat table — Fact Market Risk Snapshot × Calendar Date Dimension. Grain 1 dong / ngay."
    config:
      materialized: incremental_rebase
      incremental_strategy: ck_snapshot
      partition_by: ['ds_snpst_dt']
      file_format: "{{ var('file_format') }}"
      schema: "{{ var('ck_schema') }}"
    tags:
      - layer::clickhouse
      - concept::fact
      - domain::pttt

