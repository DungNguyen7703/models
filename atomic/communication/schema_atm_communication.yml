version: 2

models:
  - name: atm_petition
    description: "Atomic model của bảng Petition"
    config:
      materialized: scd4a
      unique_key: ["petition_id"]
      source_system: ["THANHTRA_PETITION"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'petition'
      tags:
        - layer_atomic

  - name: atm_securities_order
    description: "Atomic model của bảng Securities Order – Multi Source"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["trade_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'securities_order'
      tags:
        - layer_atomic

  - name: atm_securities_order_ordertrade_order_book_hnx
    description: "Atomic model của bảng Securities Order – ORDERTRADE.ORDER_BOOK_HNX"
    config:
      materialized: ephemeral
      tags:
        - layer_atomic

  - name: atm_securities_order_ordertrade_order_book_hose
    description: "Atomic model của bảng Securities Order – ORDERTRADE.ORDER_BOOK_HOSE"
    config:
      materialized: ephemeral
      tags:
        - layer_atomic

  - name: atm_sp_qualification_examination_assessment
    description: "Atomic model của bảng Securities Practitioner Qualification Examination Assessment"
    config:
      materialized: scd4a
      unique_key: ["sp_qualification_examination_assessment_id"]
      source_system: ["NHNCK_EXAM_SESSIONS"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'sp_qualification_examination_assessment'
      tags:
        - layer_atomic

  - name: atm_sp_qualification_examination_assessment_result
    description: "Atomic model của bảng Securities Practitioner Qualification Examination Assessment Result"
    config:
      materialized: scd4a
      unique_key: ["sp_qualification_examination_assessment_result_id"]
      source_system: ["NHNCK_EXAM_DETAILS"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'sp_qualification_examination_assessment_result'
      tags:
        - layer_atomic
