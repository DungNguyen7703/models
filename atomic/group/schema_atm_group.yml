version: 2

models:
  - name: atm_index_constituent_snapshot
    description: "Atomic model của bảng Index Constituent Snapshot"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      partition_by: ["ds_snpst_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'index_constituent_snapshot'
      source_system: ["MDDS_JAD_CSIDXINFOR"]
      tags:
        - layer_atomic

  - name: atm_market_index_snapshot
    description: "Atomic model của bảng Market Index Snapshot"
    config:
      materialized: incremental_rebase
      incremental_strategy: snapshot
      partition_by: ["ds_snpst_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'market_index_snapshot'
      source_system: ["MDDS_JAD_MARKETINFOR"]
      tags:
        - layer_atomic

  - name: atm_pc_evaluation_group
    description: "Atomic model của bảng Public Company Evaluation Group"
    config:
      materialized: upsert
      unique_key: ["pc_evaluation_group_id"]
      source_system: ["IDS_EVALUATION_GROUPS"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'pc_evaluation_group'
      tags:
        - layer_atomic

  - name: atm_application_group_x_sp_license_application_relationship
    description: "Atomic model của bảng Application Group X Securities Practitioner License Application Relationship"
    config:
      materialized: scd4a
      unique_key: ["sp_license_application_group_id", "sp_license_application_id"]
      source_system: ["NHNCK_APPLICATION_GROUP_MEMBERS"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'application_group_x_sp_license_application_relationship'
      tags:
        - layer_atomic

  - name: atm_sp_license_application_group
    description: "Atomic model của bảng Securities Practitioner License Application Group"
    config:
      materialized: scd4a
      unique_key: ["sp_license_application_group_id"]
      source_system: ["NHNCK_APPLICATION_GROUPS"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'sp_license_application_group'
      tags:
        - layer_atomic

  - name: atm_certificate_group_x_sp_license_certificate_document_relationship
    description: "Atomic model của bảng Certificate Group X Securities Practitioner License Certificate Document Relationship"
    config:
      materialized: scd4a
      unique_key: ["sp_license_certificate_document_id", "sp_license_certificate_group_id"]
      source_system: ["NHNCK_CERTIFICATE_RECORD_GROUP_MEMBERS"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'certificate_group_x_sp_license_certificate_document_relationship'
      tags:
        - layer_atomic

  - name: atm_sp_license_certificate_group
    description: "Atomic model của bảng Securities Practitioner License Certificate Group"
    config:
      materialized: scd4a
      unique_key: ["sp_license_certificate_group_id"]
      source_system: ["NHNCK_CERTIFICATE_RECORD_GROUPS"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'sp_license_certificate_group'
      tags:
        - layer_atomic
