version: 2

models:
  - name: atm_examination_annual_plan
    description: "Atomic model của bảng Examination Annual Plan"
    config:
      materialized: scd4a
      unique_key: ["examination_annual_plan_id"]
      source_system: ["THANHTRA_EXAMINATION_ANNUAL_PLAN"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'examination_annual_plan'
      tags:
        - layer_atomic

  - name: atm_inspection_annual_plan
    description: "Atomic model của bảng Inspection Annual Plan"
    config:
      materialized: scd4a
      unique_key: ["inspection_annual_plan_id"]
      source_system: ["THANHTRA_INSPECTION_ANNUAL_PLAN"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'inspection_annual_plan'
      tags:
        - layer_atomic

  - name: atm_cl_thanhtra_penalty_type
    description: "Atomic model của bảng Penalty Type"
    config:
      materialized: upsert
      unique_key: ["penalty_tp_id"]
      source_system: ["THANHTRA_PENALTY_TYPE"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'cl_thanhtra_penalty_type'
      tags:
        - layer_atomic

  - name: atm_risk_weight_config
    description: "Atomic model của bảng Risk Weight Configuration - dong gap beta_*/epsilon_error_term/weight_liquidity/weight_stability cua fct_market_risk_snpst"
    config:
      materialized: scd2
      unique_key: ["risk_weight_config_id"]
      identity_col: []
      type1_cols: []
      type2_cols: []
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'risk_weight_config'
      tags:
        - layer_atomic

  - name: atm_status_threshold_config
    description: "Atomic model của bảng Status Threshold Configuration - dong gap cac cot LOOKUP status (sentiment/margin/systemic vol/turnover velocity/cap group/sector rating)"
    config:
      materialized: scd2
      unique_key: ["status_threshold_config_id"]
      identity_col: []
      type1_cols: []
      type2_cols: []
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'status_threshold_config'
      tags:
        - layer_atomic

  - name: atm_legal_document
    description: "Atomic model của bảng Legal Document"
    config:
      materialized: scd4a
      unique_key: ["legal_document_id"]
      source_system: ["THANHTRA_LEGAL_DOCUMENT"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("atm_schema") }}'
      alias: 'legal_document'
      tags:
        - layer_atomic
