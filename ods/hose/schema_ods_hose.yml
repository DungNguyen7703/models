version: 2

models:
  - name: ods_hose_order_book
    description: "ODS model của bảng HOSE.ORDER_BOOK"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["trade_date"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_hose_schema") }}'
      alias: 'order_book'
      tags:
        - layer_ods
        - domain_hose

  - name: ods_hose_trade_book
    description: "ODS model của bảng HOSE.TRADE_BOOK"
