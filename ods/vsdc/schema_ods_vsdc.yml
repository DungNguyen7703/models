version: 2

models:
  - name: ods_vsdc_outstanding_shares
    description: "ODS model của bảng VSDC.OUTSTANDING_SHARES"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["ds_snpst_dt"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_vsdc_schema") }}'
      alias: 'outstanding_shares'
      tags:
        - layer_ods
        - domain_vsdc

