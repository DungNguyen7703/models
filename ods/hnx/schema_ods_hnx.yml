version: 2

models:
  - name: ods_hnx_order_book
    description: "ODS model của bảng HNX.ORDER_BOOK"
    config:
      materialized: incremental_rebase
      incremental_strategy: append
      partition_by: ["trade_date"]
      file_format: '{{ var("file_format") }}'
      schema: '{{ var("ods_hnx_schema") }}'
      alias: 'order_book'
      tags:
        - layer_ods
        - domain_hnx

